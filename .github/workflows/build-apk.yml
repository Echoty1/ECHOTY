name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Create capacitor.config.json
        run: |
          echo '{"appId":"com.echo.app","appName":"ECHO","webDir":"build"}' > capacitor.config.json

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode keystore (release only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.STORE_FILE_B64 }}" | base64 -d > android/app/echo-release.keystore

      - name: Create keystore.properties (release only)
        if: github.ref == 'refs/heads/main'
        run: |
          cat > android/keystore.properties << EOF
          storeFile=app/echo-release.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: |
          cd android
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: List APK directory contents (debug)
        run: |
          echo "=== APK files found ==="
          find android -name "*.apk" -type f || echo "No APK found"
          echo "=== Full output directory ==="
          ls -R android/app/build/outputs/ || echo "Outputs directory not found"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/