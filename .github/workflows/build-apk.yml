name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Create capacitor.config.json
        run: |
          echo '{"appId":"com.echo.app","appName":"ECHO","webDir":"build"}' > capacitor.config.json

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.STORE_FILE_B64 }}" | base64 -d > android/app/echo-release.keystore

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties << EOF
          storeFile=app/echo-release.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: List output files
        run: |
          echo "=== Workspace root ==="
          ls -la
          echo "=== APK release folder ==="
          ls -la android/app/build/outputs/apk/release/ || echo "Folder not found"
          echo "=== APK debug folder ==="
          ls -la android/app/build/outputs/apk/debug/ || echo "Folder not found"
          echo "=== APK folder ==="
          ls -la android/app/build/outputs/apk/ || echo "Folder not found"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
        if: success()

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
        if: success()

      - name: Upload entire APK folder (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: apk-folder
          path: android/app/build/outputs/apk/
        if: always()