name: Build APK & AAB V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch version from Firebase
        id: version
        run: |
          VERSION_DATA=$(curl -s "https://echoty-fa3ca-default-rtdb.firebaseio.com/appConfig/version.json")
          VERSION_CODE=$(echo $VERSION_DATA | jq -r '.versionCode')
          VERSION_NAME=$(echo $VERSION_DATA | jq -r '.versionName')
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Set version environment variables
        run: |
          echo "REACT_APP_VERSION=${{ steps.version.outputs.versionName }}" >> $GITHUB_ENV
          echo "REACT_APP_VERSION_CODE=${{ steps.version.outputs.versionCode }}" >> $GITHUB_ENV

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_BUILD_VERSION: ${{ github.sha }}

      - name: Create capacitor.config.json
        run: |
          echo '{"appId":"com.echoty.app","appName":"ECHO","webDir":"build"}' > capacitor.config.json

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # ─── Inject signing config into build.gradle ──────────────
      - name: Inject signing config into build.gradle
        run: |
          cd android/app
          # Insert signingConfigs block after "android {"
          sed -i '/android {/a \    signingConfigs {\n        release {\n            def keystorePropertiesFile = rootProject.file("keystore.properties")\n            def keystoreProperties = new Properties()\n            if (keystorePropertiesFile.exists()) {\n                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n            }\n            storeFile file(keystoreProperties.getProperty('\''storeFile'\'', '\''echo-release.keystore'\''))\n            storePassword keystoreProperties.getProperty('\''storePassword'\'')\n            keyAlias keystoreProperties.getProperty('\''keyAlias'\'')\n            keyPassword keystoreProperties.getProperty('\''keyPassword'\'')\n        }\n    }\n' build.gradle

          # Add signingConfig to the release buildType
          sed -i '/buildTypes {/,/}/ s/release {/release {\n            signingConfig signingConfigs.release/' build.gradle

          echo "✅ Signing config injected successfully."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Set Android version numbers
        run: |
          cd android
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.versionCode }}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.versionName }}\"/" app/build.gradle

      - name: Decode keystore (release only)
        run: |
          echo "${{ secrets.STORE_FILE_B64 }}" | base64 -d > android/app/echo-release.keystore

      - name: Create keystore.properties with correct path
        run: |
          cat > android/keystore.properties << EOF
          storeFile=echo-release.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APK (Release) with signing
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build AAB (Release Bundle) with signing
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Rename APK
        run: |
          VERSION_NAME="${{ steps.version.outputs.versionName }}"
          VERSION_CODE="${{ steps.version.outputs.versionCode }}"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            mv android/app/build/outputs/apk/release/app-release.apk "ECHO-v${VERSION_NAME}-code${VERSION_CODE}.apk"
            echo "APK renamed successfully."
          else
            echo "Warning: APK not found. Skipping APK."
          fi

      - name: Rename AAB
        run: |
          VERSION_NAME="${{ steps.version.outputs.versionName }}"
          VERSION_CODE="${{ steps.version.outputs.versionCode }}"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            mv android/app/build/outputs/bundle/release/app-release.aab "ECHO-v${VERSION_NAME}-code${VERSION_CODE}.aab"
            echo "AAB renamed successfully."
          else
            echo "Error: AAB not found. Failing build."
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ECHO-Builds
          path: |
            *.apk
            *.aab